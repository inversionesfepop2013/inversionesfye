<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVERSIONES F Y E | Gestionar Usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --v: #1E5F2D; --vo: #154420; --a: #FFB823 }
    * { box-sizing: border-box }
    html, body { font-family: 'Poppins', sans-serif }
    body { background: linear-gradient(135deg, #f4f7f5, #eef6ef 52%, #fef9f0); color: #0f172a }
    .bg-fye-verde { background: var(--v) }
    .text-fye-verde { color: var(--v) }
    .btn-verde { background: var(--v); color: #fff; transition: .25s }
    .btn-verde:hover { background: var(--vo); box-shadow: 0 8px 22px rgba(30,95,45,.25) }
    .glass-card { background: rgba(255,255,255,.92); backdrop-filter: blur(8px) }
    .inp { width: 100%; padding: .65rem 1rem; border-radius: .8rem; background: #f8fafc; border: 1px solid #cbd5e1; font-size: .875rem }
    .inp:focus { outline: none; border-color: var(--v) }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="flex flex-col">
        <span class="text-lg sm:text-xl font-black text-slate-900">INVERSIONES F Y E</span>
        <span class="text-[10px] sm:text-xs font-semibold text-fye-verde">Panel de Gestión</span>
      </div>
    </div>
    <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket mr-1"></i>Cerrar sesión
    </button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
  <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
    <h1 class="text-3xl font-bold text-slate-900 mb-2">Gestión de Usuarios Pendientes</h1>
    <p class="text-sm text-slate-500 mb-6">Aprueba o rechaza nuevas solicitudes de registro</p>

    <div id="users-list" class="space-y-4">
      <p class="text-slate-500">Cargando usuarios...</p>
    </div>
  </div>
</main>

<footer class="bg-slate-900 text-slate-400 text-center py-6 px-4 text-xs sm:text-sm mt-8">
  <p class="font-semibold text-slate-300">© 2026 INVERSIONES F Y E SRL. Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://vsaldxqblzzlzrpriucv.supabase.co';
  const SUPABASE_ANON_KEY = 'Sb_publishable_tqfbQDrGawItFonb8NnWVQ_aGM50Xzt';
  const ALLOWED_MANAGERS = ['inversionesfepop@gmail.com', 'flaquitabella875@gmail.com'];
  const STORAGE_KEY = 'fye_users_v1';

  const supabase = window.supabase && typeof window.supabase.createClient === 'function'
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  let currentUser = null;
  let sessionToken = null;

  function notify(msg, type = 'info') {
    const colors = { error: '#DC2626', warning: '#D97706', success: '#15803d', info: '#1E5F2D' };
    Toastify({
      text: msg,
      duration: 4000,
      gravity: 'top',
      position: 'right',
      style: { background: colors[type] || '#1E5F2D', borderRadius: '12px', fontSize: '14px', fontWeight: '600' }
    }).showToast();
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function normalizeEmail(v = '') {
    return String(v).trim().toLowerCase();
  }

  async function loadPendingUsers() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      const users = stored ? JSON.parse(stored) : [];

      const pending = users.filter(u => u.status !== 'aprobado');

      if (pending.length === 0) {
        document.getElementById('users-list').innerHTML = '<p class="text-slate-500">No hay usuarios pendientes.</p>';
        return;
      }

      const html = pending.map(u => `
        <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-3">
          <div class="flex flex-wrap justify-between gap-2">
            <div>
              <p class="font-semibold text-sm">${esc(u.nombre || '(sin nombre)')}</p>
              <p class="text-xs text-slate-500">${esc(u.email || 'Sin email')}</p>
              <p class="text-xs text-slate-500">${esc(u.telefono || 'Sin teléfono')}</p>
              <p class="text-xs text-slate-500">${esc(u.cedula || 'Sin documento')}</p>
              <p class="text-xs text-slate-600 mt-1"><strong>Tipo:</strong> ${u.tipo_cliente === 'ahorista' ? 'Cliente de Ahorro' : u.tipo_cliente === 'inversionista' ? 'Cliente Inversionista' : 'Cliente de Cambio'}</p>
            </div>
            <span class="text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700">Pendiente</span>
          </div>

          <div class="flex flex-wrap gap-2">
            <button class="px-4 py-2 rounded-xl bg-fye-verde text-white text-xs font-semibold hover:bg-green-700" onclick="approveUser('${esc(u.cedula)}', '${esc(u.email)}')">Aprobar</button>
            <button class="px-4 py-2 rounded-xl bg-red-500 text-white text-xs font-semibold hover:bg-red-600" onclick="rejectUser('${esc(u.cedula)}', '${esc(u.email)}')">Rechazar</button>
          </div>
        </div>
      `).join('');

      document.getElementById('users-list').innerHTML = html;
    } catch (err) {
      console.error(err);
      notify('Error al cargar usuarios', 'error');
    }
  }

  async function approveUser(cedula, email) {
    if (!currentUser || !ALLOWED_MANAGERS.includes(normalizeEmail(currentUser.email))) {
      return notify('No tienes permiso para aprobar usuarios', 'error');
    }

    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      const users = stored ? JSON.parse(stored) : [];
      const idx = users.findIndex(u => u.cedula === cedula);

      if (idx < 0) return notify('Usuario no encontrado', 'error');

      users[idx].status = 'aprobado';
      users[idx].updated_at = new Date().toISOString();

      localStorage.setItem(STORAGE_KEY, JSON.stringify(users));

      // Enviar email de confirmación
      await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          nombre: users[idx].nombre,
          tipo_cliente: users[idx].tipo_cliente,
          status: 'aprobado'
        })
      }).catch(e => console.warn('No se pudo enviar email:', e));

      notify('Usuario aprobado correctamente', 'success');
      loadPendingUsers();
    } catch (err) {
      console.error(err);
      notify('Error al aprobar usuario', 'error');
    }
  }

  async function rejectUser(cedula, email) {
    if (!currentUser || !ALLOWED_MANAGERS.includes(normalizeEmail(currentUser.email))) {
      return notify('No tienes permiso para rechazar usuarios', 'error');
    }

    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      const users = stored ? JSON.parse(stored) : [];
      const idx = users.findIndex(u => u.cedula === cedula);

      if (idx < 0) return notify('Usuario no encontrado', 'error');

      users[idx].status = 'rechazado';
      users[idx].updated_at = new Date().toISOString();

      localStorage.setItem(STORAGE_KEY, JSON.stringify(users));

      notify('Usuario rechazado', 'success');
      loadPendingUsers();
    } catch (err) {
      console.error(err);
      notify('Error al rechazar usuario', 'error');
    }
  }

  function logout() {
    sessionStorage.removeItem('fye_session');
    window.location.href = '/';
  }

  // Validar acceso
  window.addEventListener('load', async () => {
    const session = sessionStorage.getItem('fye_session');
    if (!session) {
      window.location.href = '/';
      return;
    }

    const stored = localStorage.getItem(STORAGE_KEY);
    const users = stored ? JSON.parse(stored) : [];
    currentUser = users.find(u => u.cedula === session);

    if (!currentUser || !ALLOWED_MANAGERS.includes(normalizeEmail(currentUser.email))) {
      notify('No tienes acceso a esta página', 'error');
      setTimeout(() => { window.location.href = '/'; }, 2000);
      return;
    }

    loadPendingUsers();
  });
</script>
</body>
</html>
