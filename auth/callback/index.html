stringify({password:a})});const d=await r.json().catch(function(){return {};});$('new-password').value='';$('confirm-password').value='';if(!r.ok)throw new Error(d.error||'No se pudo guardar la contraseña.');status.textContent='Cuenta activada. Abriendo tu portal…';const target=window.fyeRole==='admin'?'/pages/manage-users.html':window.fyeRole==='inversionista'?'/pages/investor.html':'/';setTimeout(function(){window.location.replace(target);},400);}catch(e){fail(e.message||'No se pudo guardar la contraseña.');}});})();</script></body></html>
