<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVERSIONES F Y E | Procesando acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      color: #111827;
    }
    .card {
      width: min(92vw, 460px);
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      padding: 32px 24px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(30, 95, 45, 0.14);
      border-left-color: #1E5F2D;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }
    p {
      margin: 0;
      color: #475569;
      line-height: 1.5;
    }
    .error {
      color: #b91c1c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Procesando acceso...</h1>
    <p id="status">Estamos validando tu sesión con Google o Apple.</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://vsaldxqblzzlzrpriucv.supabase.co';
    const SUPABASE_ANON_KEY = 'Sb_publishable_tqfbQDrGawItFonb8NnWVQ_aGM50Xzt';

    const supabase = window.supabase && typeof window.supabase.createClient === 'function'
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    async function finishAuth() {
      const statusEl = document.getElementById('status');

      if (!supabase) {
        statusEl.textContent = 'No se pudo inicializar Supabase. Revisa tu conexión e inténtalo de nuevo.';
        statusEl.classList.add('error');
        return;
      }

      try {
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          throw error;
        }

        if (data?.session) {
          statusEl.textContent = '¡Acceso correcto! Redirigiendo...';
          setTimeout(() => {
            window.location.href = '../../';
          }, 700);
          return;
        }

        statusEl.textContent = 'No se pudo completar la sesión. Intenta nuevamente.';
        statusEl.classList.add('error');
      } catch (err) {
        console.error('Error al completar la autenticación:', err);
        statusEl.textContent = 'Hubo un problema con el inicio de sesión. Intenta nuevamente.';
        statusEl.classList.add('error');
      }
    }

    finishAuth();
  </script>
</body>
</html>
