<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Secreto | Inversiones FYE</title>
    <style>
      :root {
        --verde: #1E5F2D;
        --verde-oscuro: #154420;
        --oro: #FFB823;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f4f7f5, #eef6ef 52%, #fef9f0);
        color: #0f172a;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 760px);
        background: white;
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      }
      .badge {
        display: inline-block;
        background: rgba(30, 95, 45, 0.12);
        color: var(--verde);
        font-weight: 700;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
      }
      h1 {
        margin-top: 16px;
        color: var(--verde-oscuro);
      }
      p {
        color: #475569;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        background: var(--verde);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="badge">Ruta administrativa</span>
        <h1>Panel interno de Inversiones FYE</h1>
        <p>
          Esta ruta está oculta y restringida. El acceso debe estar limitado a usuarios autorizados
          con credenciales del lado del servidor y un secreto administrativo válido.
        </p>
        <div class="actions">
          <button type="button" onclick="alert('Acceso validado solo por backend seguro')">Validar acceso</button>
          <button class="secondary" type="button" onclick="window.location.href='/'">Volver al sitio</button>
        </div>
      </div>
    </div>
  </body>
</html>
